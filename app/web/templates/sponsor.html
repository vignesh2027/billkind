{% extends "base.html" %}{% block title %}My giving · Billkind{% endblock %}
{% block body_class %}app{% endblock %}
{% block main %}
<div id="feed">{% include "_sponsor_feed.html" %}</div>
{% endblock %}
{% block scripts %}
<script>
(() => {
  const es = new EventSource('/events/stream');
  let t = null;
  const reload = () => { clearTimeout(t); t = setTimeout(async () => {
    const open = [...document.querySelectorAll('#feed details[open]')].map(d => d.closest('[id]') && d.closest('[id]').id);
    const r = await fetch('/sponsor/feed'); if (!r.ok) return;
    document.getElementById('feed').innerHTML = await r.text();
    open.forEach(id => { const el = id && document.getElementById(id); const d = el && el.querySelector('details'); if (d) d.open = true; });
  }, 250); };
  ['payout_sent', 'paid', 'thanks', 'fully_funded', 'refund', 'funded'].forEach(k => es.addEventListener(k, ev => {
    const d = JSON.parse(ev.data); if (!d.mine) return; reload();
    if (k === 'paid') BK.toast('Paid: ' + d.message, 'ok');
    if (k === 'thanks') BK.toast(d.message);
  }));
  es.addEventListener('message', ev => { const d = JSON.parse(ev.data); reload(); BK.toast(d.message); });
})();
</script>
{% endblock %}
