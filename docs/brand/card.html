<style>

  html, body { margin: 0; }
  body { width: 1536px; height: 1024px; overflow: hidden; position: relative; font-family: "Manrope", sans-serif;

  .tag i { width: 9px; height: 9px; border-radius: 50%; background: #33456F; display: inline-block; }
  .pill { margin-top: 44px; display: flex; align-items: center; gap: 0; padding: 18px 26px; border-radius: 999px;
    background: linear-gradient(180deg, rgba(225, 237, 255, .95), rgba(210, 228, 255, .9)); box-shadow: inset 0 1px 0 #fff, 0 10px 30px rgba(20, 99, 255, .10); }
  .pill svg { width: 46px; height: 46px; margin: 0 42px; stroke: #1463FF; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .pill b { width: 1.5px; height: 44px; background: rgba(20, 99, 255, .25); }
  body.og { width: 1200px; height: 630px; }
  body.og .mark { width: 270px; height: 270px; margin-bottom: -18px; }
  body.og .word { height: 96px; margin-left: 20px; }
  body.og .tag { font-size: 28px; margin-top: 10px; }
  body.og .tag i { width: 7px; height: 7px; }
  body.og .pill { display: none; }
  body.og .line { display: block; }
  .line { display: none; margin-top: 26px; font-size: 26px; font-weight: 700; color: #0B1E5B; }
  .line em { font-style: normal; color: #1463FF; }
</style>
